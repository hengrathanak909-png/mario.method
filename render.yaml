services:
  - type: web
    name: mario-method
    runtime: python
    plan: free
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MARIO_ACCESS_PASSWORD
        sync: false
      - key: POSTPEER_API_KEY
        sync: false
